name: CI/CD Pipeline to Azure

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-net@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test --no-build --verbosity normal

    # ==========================================
    # بخش اتصال خودکار، ساخت داکر ایمیج و استقرار در آژور
    # ==========================================
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and Push to Azure Container Registry (ACR)
      run: |
        az acr build --registry inventoryregistrysepid --image inventory-api:${{ github.sha }} --file CloudNativeInventory.Api/Dockerfile .

    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name inventory-app \
          --resource-group Inventory_RG \
          --image inventoryregistrysepid.azurecr.io/inventory-api:${{ github.sha }}